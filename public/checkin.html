<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KeyFlow Check-in</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="%23ffb703"/><circle cx="22" cy="32" r="8" fill="none" stroke="%2323170a" stroke-width="6"/><path d="M30 32h22M46 32v9M38 32v6" stroke="%2323170a" stroke-width="6" stroke-linecap="round" fill="none"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1b2a; --surface:#14283c; --surface2:#1b3550; --line:#274867;
    --ink:#e8eef5; --muted:#8aa0b8; --amber:#ffb703; --amber-d:#e0a200;
    --ok:#2dc653; --err:#ef476f; --blue:#5aa0f2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(1100px 550px at 50% -12%, rgba(255,183,3,.09), transparent 60%), var(--bg); color:var(--ink);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    font-size:16px; line-height:1.5; padding:0 0 40px;
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);}
  header{background:linear-gradient(180deg, rgba(23,44,66,.96), rgba(13,27,42,.94)); border-bottom:1px solid var(--line);
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top)); box-shadow:0 6px 24px -8px rgba(0,0,0,.4); position:relative; z-index:2}
  .brand{display:inline-flex; align-items:center; gap:10px}
  .brand-badge{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#ffd166,var(--amber)); box-shadow:0 5px 16px -5px rgba(255,183,3,.6)}
  .brand-badge svg{width:20px; height:20px}
  .brand-name{font-weight:800; font-size:17px; letter-spacing:-.01em}
  .brand-name .flow{color:var(--amber)}
  header h1{margin:10px 0 0; font-size:22px; font-weight:800; letter-spacing:-.02em}
  header .sub{font-size:13.5px; color:var(--muted); margin-top:5px}
  .wrap{max-width:640px; margin:0 auto; padding:16px; animation:fadeSlideIn .45s ease both}
  @keyframes fadeSlideIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  .card{background:linear-gradient(165deg, var(--surface), var(--surface2) 140%); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-bottom:14px; box-shadow:0 8px 24px -12px rgba(0,0,0,.45)}
  label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; font-weight:600}
  input[type=text], input[type=date], select{
    width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:12px 12px; font-size:16px; font-family:inherit; transition:border-color .15s, box-shadow .15s;}
  input:focus, select:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(255,183,3,.2)}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .btn{appearance:none; border:none; border-radius:13px; font-size:15px; font-weight:700; padding:14px 16px; cursor:pointer;
    font-family:inherit; width:100%; transition:transform .12s ease, filter .12s ease, box-shadow .12s ease}
  .btn.primary{background:linear-gradient(135deg,#ffce54,var(--amber)); color:#23170a; box-shadow:0 8px 22px -6px rgba(255,183,3,.5)}
  .btn.primary:active{transform:scale(.98); filter:brightness(.95)}
  .btn.accent{background:linear-gradient(135deg,#5aa0f2,#7c5cff); color:#fff; box-shadow:0 8px 22px -6px rgba(124,92,255,.45)}
  .btn.accent:active{transform:scale(.98); filter:brightness(.9)}
  .btn.ghost{background:var(--surface2); color:var(--ink); border:1px solid var(--line)}
  .btn.ghost:active{transform:scale(.98)}
  .btn.sm{padding:9px 12px; font-size:13px; width:auto}
  .btn:disabled{opacity:.5}
  .muted{color:var(--muted); font-size:12.5px}
  .guest{border:1px solid var(--line); border-radius:15px; padding:14px; margin-top:12px; background:var(--surface2); box-shadow:0 6px 18px -10px rgba(0,0,0,.4)}
  .ghead{display:flex; justify-content:space-between; align-items:center; gap:8px}
  .gname{font-weight:700; font-size:14px}
  .thumbs{display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; align-items:center; border-radius:10px; transition:outline-color .15s}
  .thumbs.drag{outline:2px dashed var(--amber); outline-offset:4px}
  .thumb{position:relative; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:var(--surface)}
  .thumb img{width:100%; height:100%; object-fit:cover}
  .thumb .rm{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:1; cursor:pointer}
  .addimg{width:64px; height:64px; border:1.5px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:22px; cursor:pointer; background:transparent}
  .datepick{position:relative; display:inline-flex; width:100%}
  .datepick input[type=date]{width:100%}
  .spin{display:inline-block; width:13px; height:13px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#0a1826; color:#fff; padding:11px 18px; border-radius:12px;
    font-size:13px; z-index:50; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%; border:1px solid var(--line); box-shadow:0 10px 30px -8px rgba(0,0,0,.5)}
  .toast.show{opacity:.97}
  .hint{font-size:12px; color:var(--muted); background:var(--surface2); border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:8px; padding:9px 11px; margin-top:10px}
  .consent{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--muted); margin-top:14px}
  .consent input[type=checkbox]{-webkit-appearance:none; appearance:none; width:24px; height:24px; min-width:24px;
    flex-shrink:0; margin-top:0; border:2px solid var(--line); border-radius:7px; background:var(--surface2);
    cursor:pointer; position:relative}
  .consent input[type=checkbox]:checked{background:var(--amber); border-color:var(--amber)}
  .consent input[type=checkbox]:checked::after{content:'✓'; position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; color:#23170a; font-size:16px; font-weight:900; line-height:1}
  .ok-screen{text-align:center; padding:44px 16px}
  .ok-screen h2{font-size:25px; font-weight:800; letter-spacing:-.02em; margin:0 0 10px}
  .warn-badge{font-size:10px; color:var(--amber); margin-left:6px; font-weight:700}
  .field-warn{outline:2px solid var(--amber)!important; border-color:var(--amber)!important}
  .steplbl{font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--amber); font-weight:700; margin:14px 0 8px}
  .steplbl:first-child{margin-top:0}
  .lang-screen{max-width:420px; margin:60px auto; padding:16px; text-align:center}
  .lang-btn{display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin-top:10px;
    background:var(--surface2); border:1px solid var(--line); color:var(--ink); border-radius:13px; padding:15px 16px;
    font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; transition:border-color .12s, transform .12s}
  .lang-btn:active{border-color:var(--amber); transform:scale(.98)}
  .lang-btn .flag{font-size:22px}
  .lang-switch-btn{background:var(--surface2); border:1px solid var(--line); border-radius:999px; padding:5px 11px;
    font-size:18px; cursor:pointer; line-height:1; flex-shrink:0}
  .dropzone{margin-top:10px; border:2px dashed var(--line); border-radius:16px; padding:24px 14px; text-align:center;
    cursor:pointer; transition:border-color .15s, background .15s; background:var(--surface)}
  .dropzone.drag{border-color:var(--amber); background:rgba(245,180,40,.07)}
  .dropzone .dz-t{font-weight:700; margin-top:8px}
  .dropzone .dz-s{font-size:12px; color:var(--muted); margin-top:4px}
  .icon-badge{width:92px; height:92px; margin:0 auto 18px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 32% 28%, rgba(255,183,3,.32), rgba(255,183,3,.05) 62%, transparent 75%), var(--surface2);
    border:1px solid rgba(255,183,3,.3); box-shadow:0 12px 30px -8px rgba(255,183,3,.28)}
  .icon-badge svg{width:46px; height:46px}
  .trust-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:2px 0 24px}
  .trust-chip{display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--line);
    border-radius:999px; padding:8px 14px; font-size:12.5px; color:var(--muted); font-weight:600}
  .trust-chip svg{width:15px; height:15px; flex-shrink:0}
  .dropzone .dz-cam{width:36px; height:36px}
</style>
</head>
<body>
<header>
  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px">
    <div class="brand">
      <span class="brand-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="#23170a" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.8" cy="12" r="3.1"/><path d="M11 12h9.5M17.8 12v3M14.6 12v2.2"/></svg>
      </span>
      <span class="brand-name">Key<span class="flow">Flow</span></span>
    </div>
    <button class="lang-switch-btn" id="langSwitchBtn" style="display:none" onclick="apriSelettoreLingua()">🌐</button>
  </div>
  <h1 id="pageTitle">Check-in</h1>
  <div class="sub" id="subHeader"></div>
</header>

<div class="wrap lang-screen" id="langWrap">
  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2M12 3.4c2.4 2.5 3.7 5.5 3.7 8.6s-1.3 6.1-3.7 8.6c-2.4-2.5-3.7-5.5-3.7-8.6S9.6 5.9 12 3.4z"/></svg>
  </div>
  <div class="muted" style="margin-bottom:6px">Select your language · Scegli la lingua<br>Choisissez la langue · Elige el idioma</div>
  <button class="lang-btn" onclick="sceglilingua('it')"><span class="flag">🇮🇹</span> Italiano</button>
  <button class="lang-btn" onclick="sceglilingua('en')"><span class="flag">🇬🇧</span> English</button>
  <button class="lang-btn" onclick="sceglilingua('fr')"><span class="flag">🇫🇷</span> Français</button>
  <button class="lang-btn" onclick="sceglilingua('es')"><span class="flag">🇪🇸</span> Español</button>
</div>

<div class="wrap ok-screen" id="welcomeWrap" style="display:none">
  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 18.5h17"/><path d="M5.2 18.5v-.6a6.8 6.8 0 0 1 13.6 0v.6"/><path d="M12 8.6V7"/><path d="M10.3 7h3.4"/></svg>
  </div>
  <h2 id="welcomeTitle"></h2>
  <div class="muted" id="welcomeText" style="margin-bottom:20px; max-width:440px; margin-left:auto; margin-right:auto"></div>
  <div class="trust-row">
    <div class="trust-chip"><svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-3 7.4-7 9-4-1.6-7-4.6-7-9V6z"/><path d="m9.2 11.8 2 2 3.6-4"/></svg> <span id="trustSecure"></span></div>
    <div class="trust-chip"><svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg> <span id="trustFast"></span></div>
    <div class="trust-chip"><svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M3.5 19.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="m15 10.5 2 2 3.5-4"/></svg> <span id="trustReviewed"></span></div>
  </div>
  <button class="btn primary" id="welcomeBtn" style="max-width:320px; margin:0 auto" onclick="iniziaCheckin()"></button>
</div>

<div class="wrap" id="formWrap" style="display:none">
  <div class="card">
    <div class="row">
      <div><label id="labArrivo"></label><div class="datepick"><input id="arrivoInput" type="date" onchange="setDate('arrivo',this.value)"></div></div>
      <div><label id="labPartenza"></label><div class="datepick"><input id="partenzaInput" type="date" onchange="setDate('partenza',this.value)"></div></div>
    </div>
    <div class="muted" id="nottiInfo" style="margin-top:8px"></div>
  </div>

  <div id="guests"></div>
  <button class="btn ghost" id="btnAddGuest" onclick="addGuest()"></button>

  <div class="card" style="margin-top:14px">
    <div class="steplbl" id="privacyTitle"></div>
    <div class="hint" id="privacyBody" style="line-height:1.6"></div>
    <label class="consent">
      <input type="checkbox" id="consenso">
      <span id="consentLabel"></span>
    </label>
    <button class="btn primary" id="submitBtn" style="margin-top:14px" onclick="inviaCheckin()"></button>
    <div class="muted" id="submitStatus" style="margin-top:8px"></div>
  </div>
</div>

<div class="wrap ok-screen" id="okWrap" style="display:none">
  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="m8.3 12.4 2.6 2.6 5-5.6"/></svg>
  </div>
  <h2 id="okTitle"></h2>
  <div class="muted" id="okText"></div>
</div>

<div class="wrap ok-screen" id="blockWrap" style="display:none">
  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--err)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.2"/><path d="M8.2 11V8a3.8 3.8 0 0 1 7.6 0v3"/><path d="M12 14.8v1.7"/></svg>
  </div>
  <h2 id="blockTitle"></h2>
  <div class="muted" id="blockText"></div>
</div>

<div class="toast" id="toast"></div>

<script src="shared.js"></script>

function t(key){ return (T[lang]||T.it)[key]; }
const FLAGS={it:'🇮🇹',en:'🇬🇧',fr:'🇫🇷',es:'🇪🇸'};

/* ===== schermate: solo una visibile alla volta (lang / form / ok / block) ===== */
let onboardingFatto=false;
let vistaAttuale=null;      // 'welcomeWrap' | 'formWrap' | 'okWrap' | 'blockWrap'
let vistaPrimaDiLingua=null;
function mostraSolo(id){
  ['welcomeWrap','formWrap','okWrap','blockWrap'].forEach(x=>{ const el=$('#'+x); if(el)el.style.display=(x===id)?'block':'none'; });
  vistaAttuale=id;
}
function iniziaCheckin(){ verificaAccesso(); }
function aggiornaPulsanteLingua(){
  const b=$('#langSwitchBtn'); if(!b)return;
  b.textContent=FLAGS[lang]||'🌐';
  b.style.display=onboardingFatto?'inline-flex':'none';
}
function apriSelettoreLingua(){
  vistaPrimaDiLingua=vistaAttuale;
  ['welcomeWrap','formWrap','okWrap','blockWrap'].forEach(x=>{ const el=$('#'+x); if(el)el.style.display='none'; });
  $('#langWrap').style.display='block';
}
function sceglilingua(l){
  lang=l; localStorage.setItem('keyflow_lang',l); document.documentElement.lang=l;
  $('#langWrap').style.display='none';
  applicaTraduzioniStatiche();
  aggiornaPulsanteLingua();
  caricaNomeStruttura();
  if(!onboardingFatto){
    onboardingFatto=true;
    aggiornaPulsanteLingua();
    mostraSolo('welcomeWrap');
  }else if(vistaPrimaDiLingua){
    mostraSolo(vistaPrimaDiLingua);
  }
}

const codice=new URLSearchParams(location.search).get('c')||'';
const strutturaId=new URLSearchParams(location.search).get('s')||'';
async function caricaNomeStruttura(){
  if(!strutturaId)return;
  try{
    const r=await fetch('/api/strutture'); const data=await r.json();
    const s=(data.strutture||[]).find(x=>x.id===strutturaId);
    if(s){ document.title=s.nome+' · KeyFlow'; const h=$('#pageTitle'); if(h)h.textContent=s.nome+' — Check-in'; }
  }catch(e){/* offline: resta il titolo generico, non blocca il check-in */}
}

let arrivo='';
let partenza='';
let notti=0;
let guests=[];

function setDate(kind,iso){
  if(kind==='arrivo')arrivo=dateToItalian(iso); else partenza=dateToItalian(iso);
  aggiornaNotti();
}
function aggiornaNotti(){
  const info=$('#nottiInfo'); if(!info)return;
  const pa=italianToDate(arrivo), pp=italianToDate(partenza);
  if(pa&&pp){
    notti=Math.round((pp-pa)/864e5);
    info.textContent = notti>0 ? `${notti} ${notti===1?t('notte_s'):t('notte_p')}` : t('notti_error');
  } else { notti=0; info.textContent=''; }
}
function italianToDate(gg){ const m=(gg||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m?new Date(+m[3],+m[2]-1,+m[1]):null; }

function nuovoOspite(){ return {id:uid(), imgs:[], cognome:'',nome:'',sesso:'',dataNascita:'',comuneNascita:'',statoNascita:'',cittadinanza:'',tipoDoc:'',numeroDoc:'',luogoRilascio:'', _busy:false, _warn:[]}; }
function addGuest(){ guests.push(nuovoOspite()); render(); }
function rmGuest(id){ guests=guests.filter(g=>g.id!==id); render(); }
function getG(id){ return guests.find(g=>g.id===id); }
function setG(id,k,v){ getG(id)[k]=v; render(); }

function thumb(src,onRm){const d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${src}"><button class="rm">×</button>`;d.querySelector('.rm').onclick=e=>{e.preventDefault();onRm();};return d;}
function bigDropzone(onFiles){
  const dz=document.createElement('div'); dz.className='dropzone';
  dz.innerHTML=`<svg class="dz-cam" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h2.8l1.6-2.2h7.2L17.2 8.5H20a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.4" r="3.1"/></svg><div class="dz-t">${t('dz_title')}</div><div class="dz-s">${t('dz_sub')}</div>`;
  const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.multiple=true; i.style.display='none';
  i.onchange=e=>{onFiles(e.target.files); i.value='';};
  dz.appendChild(i);
  dz.onclick=()=>i.click();
  wireThumbsDrop(dz,onFiles);
  return dz;
}
function wireThumbsDrop(el,onFiles){
  ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();el.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();el.classList.remove('drag');}));
  el.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)onFiles(e.dataTransfer.files);});
}
async function handleImgs(id,files){
  const list=onlyImages(files); if(!list.length)return;
  const g=getG(id); g.imgs=g.imgs||[];
  for(const f of list){ g.imgs.push(await fileToDataURL(f)); }
  render();
}

const CAMPO_AI_TO_G={cognome:'cognome',nome:'nome',sesso:'sesso',data_nascita:'dataNascita',comune_nascita:'comuneNascita',
  stato_nascita:'statoNascita',cittadinanza:'cittadinanza',tipo_documento:'tipoDoc',numero_documento:'numeroDoc',luogo_rilascio:'luogoRilascio'};
async function estraiDati(id){
  const g=getG(id); if(!g.imgs.length){toast(t('toast_add_photo_first'));return;}
  g._busy=true; render();
  try{
    const j=await apiExtract(g.imgs,'documento');
    Object.assign(g,{cognome:j.cognome||g.cognome,nome:j.nome||g.nome,sesso:j.sesso||g.sesso,
      dataNascita:j.data_nascita||g.dataNascita,comuneNascita:j.comune_nascita||'',statoNascita:j.stato_nascita||g.statoNascita,
      cittadinanza:j.cittadinanza||g.cittadinanza,tipoDoc:j.tipo_documento||g.tipoDoc,numeroDoc:j.numero_documento||g.numeroDoc,
      luogoRilascio:j.luogo_rilascio||g.luogoRilascio});
    g._warn=(j.incertezze||[]).map(k=>CAMPO_AI_TO_G[k]).filter(Boolean);
    toast(t('toast_data_read'));
  }catch(e){ toast(t('toast_extract_failed')+e.message); }
  g._busy=false; render();
}

function warnBadge(g,k){ return (g._warn||[]).includes(k) ? ` <span class="warn-badge">${t('warn_badge')}</span>` : ''; }
function fw(g,k){ return (g._warn||[]).includes(k) ? 'field-warn' : ''; }

function render(){
  const root=$('#guests'); if(!root||!lang)return;
  const active=document.activeElement;
  const activeId=active&&active.id?active.id:null;
  const selStart=active&&typeof active.selectionStart==='number'?active.selectionStart:null;
  const selEnd=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
  const scrollY=window.scrollY;

  root.innerHTML='';
  guests.forEach((g,idx)=>{
    const el=document.createElement('div'); el.className='guest';
    const haFoto=(g.imgs||[]).length>0;
    const campi=!haFoto?`<div class="muted" style="margin-top:10px">${t('no_photo_msg')}</div>`:`
      <div class="steplbl">${t('step2_label')}</div>
      <div class="hint">${t('step2_hint')}</div>
      <div class="row" style="margin-top:10px">
        <div><label>${t('label_cognome')}${warnBadge(g,'cognome')}</label><input id="cogn-${g.id}" type="text" class="${fw(g,'cognome')}" value="${g.cognome||''}" oninput="setG('${g.id}','cognome',this.value)"></div>
        <div><label>${t('label_nome')}${warnBadge(g,'nome')}</label><input id="nome-${g.id}" type="text" class="${fw(g,'nome')}" value="${g.nome||''}" oninput="setG('${g.id}','nome',this.value)"></div>
      </div>
      <div class="row">
        <div><label>${t('label_sesso')}${warnBadge(g,'sesso')}</label><select id="sesso-${g.id}" class="${fw(g,'sesso')}" onchange="setG('${g.id}','sesso',this.value)"><option value="">—</option><option ${g.sesso==='M'?'selected':''}>M</option><option ${g.sesso==='F'?'selected':''}>F</option></select></div>
        <div><label>${t('label_data_nascita')}${warnBadge(g,'dataNascita')}</label><div class="datepick"><input id="nasc-${g.id}" type="date" class="${fw(g,'dataNascita')}" value="${italianToIso(g.dataNascita)}" onchange="setG('${g.id}','dataNascita',dateToItalian(this.value))"></div></div>
      </div>
      <label>${t('label_comune_nascita')}${warnBadge(g,'comuneNascita')} <span class="muted">${t('comune_nascita_hint')}</span></label>
      <input id="comune-${g.id}" type="text" class="${fw(g,'comuneNascita')}" value="${g.comuneNascita||''}" oninput="setG('${g.id}','comuneNascita',this.value)">
      <label>${t('label_stato_nascita')}${warnBadge(g,'statoNascita')}</label>
      <input id="stato-${g.id}" type="text" placeholder="${t('placeholder_es')}" class="${fw(g,'statoNascita')}" value="${g.statoNascita||''}" oninput="setG('${g.id}','statoNascita',this.value)">
      <label>${t('label_cittadinanza')}${warnBadge(g,'cittadinanza')}</label>
      <input id="citt-${g.id}" type="text" placeholder="${t('placeholder_es')}" class="${fw(g,'cittadinanza')}" value="${g.cittadinanza||''}" oninput="setG('${g.id}','cittadinanza',this.value)">
      <label>${t('label_tipo_doc')}${warnBadge(g,'tipoDoc')}</label>
      <select id="tipodoc-${g.id}" class="${fw(g,'tipoDoc')}" onchange="setG('${g.id}','tipoDoc',this.value)">
        <option value="">—</option>
        ${DOC_TYPES.map(d=>`<option value="${d.value}" ${g.tipoDoc===d.value?'selected':''}>${t(d.key)}</option>`).join('')}
      </select>
      <label>${t('label_numero_doc')}${warnBadge(g,'numeroDoc')}</label>
      <input id="numdoc-${g.id}" type="text" class="${fw(g,'numeroDoc')}" value="${g.numeroDoc||''}" oninput="setG('${g.id}','numeroDoc',this.value)">
      <label>${t('label_luogo_rilascio')}${warnBadge(g,'luogoRilascio')} <span class="muted">${t('luogo_rilascio_hint')}</span></label>
      <input id="luogo-${g.id}" type="text" class="${fw(g,'luogoRilascio')}" value="${g.luogoRilascio||''}" oninput="setG('${g.id}','luogoRilascio',this.value)">
    `;
    el.innerHTML=`
      <div class="ghead"><span class="gname">👤 ${g.cognome?`${g.cognome} ${g.nome||''}`:t('guest_default_name')+' '+(idx+1)}</span>
        ${guests.length>1?`<button class="btn ghost sm" onclick="rmGuest('${g.id}')">×</button>`:''}</div>
      <div class="steplbl">${t('step1_label')}</div>
      <div class="thumbs" id="gimg-${g.id}"></div>
      <div id="dz-${g.id}"></div>
      <button class="btn accent sm" style="width:100%" onclick="estraiDati('${g.id}')" ${(!haFoto||g._busy)?'disabled':''}>${g._busy?'<span class="spin"></span> '+t('btn_extract_loading'):t('btn_extract')}</button>
      ${campi}
    `;
    root.appendChild(el);
    const gi=el.querySelector('#gimg-'+g.id);
    (g.imgs||[]).forEach((im,i)=>gi.appendChild(thumb(im,()=>{g.imgs.splice(i,1);render();})));
    const dzHost=el.querySelector('#dz-'+g.id);
    if(dzHost) dzHost.appendChild(bigDropzone(files=>handleImgs(g.id,files)));
  });

  if(activeId){
    const el=document.getElementById(activeId);
    if(el&&typeof el.focus==='function'){
      el.focus({preventScroll:true});
      if(selStart!=null&&typeof el.setSelectionRange==='function'){
        try{el.setSelectionRange(selStart,selEnd);}catch(e){/* input type non supporta selectionRange */}
      }
    }
  }
  window.scrollTo(0,scrollY);
}

// incolla (Ctrl+V) va sempre sull'ultimo ospite della lista
document.addEventListener('paste',e=>{
  if(!guests.length)return;
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  const files=[...items].filter(it=>it.kind==='file'&&it.type&&it.type.startsWith('image/')).map(it=>it.getAsFile()).filter(Boolean);
  if(!files.length)return;
  e.preventDefault();
  handleImgs(guests[guests.length-1].id,files);
});

async function inviaCheckin(){
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(arrivo)){toast(t('toast_indica_arrivo'));return;}
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(partenza)){toast(t('toast_indica_partenza'));return;}
  if(!(notti>0)){toast(t('notti_error'));return;}
  const validi=guests.filter(g=>g.cognome||g.nome);
  if(!validi.length){toast(t('toast_add_guest'));return;}
  if(!$('#consenso').checked){toast(t('toast_accept_privacy'));return;}

  const btn=$('#submitBtn'); btn.disabled=true;
  $('#submitStatus').innerHTML=`<span class="spin"></span> ${t('submit_status_invio')}`;
  try{
    const payload={codice, struttura:strutturaId, arrivo, partenza, notti, ospiti: validi.map(g=>({
      cognome:g.cognome,nome:g.nome,sesso:g.sesso,dataNascita:g.dataNascita,comuneNascita:g.comuneNascita,
      statoNascita:g.statoNascita,cittadinanza:g.cittadinanza,tipoDoc:g.tipoDoc,numeroDoc:g.numeroDoc,luogoRilascio:g.luogoRilascio,
      incertezze:(g._warn||[]), immagini:g.imgs||[]
    }))};
    const r=await fetch('/api/checkin-submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||'Errore');
    mostraSolo('okWrap');
  }catch(e){
    toast(t('toast_send_failed')+e.message);
    $('#submitStatus').textContent='';
    btn.disabled=false;
  }
}

async function verificaAccesso(){
  if(!codice){ mostraSolo('blockWrap'); return; }
  try{
    const r=await fetch('/api/checkin-verify?c='+encodeURIComponent(codice));
    const data=await r.json();
    if(data.ok){ mostraSolo('formWrap'); if(!guests.length)addGuest(); }
    else{ mostraSolo('blockWrap'); }
  }catch(e){
    // offline: non possiamo verificare, ma non blocchiamo del tutto l'ospite che ha gia' il link giusto
    mostraSolo('formWrap'); if(!guests.length)addGuest();
  }
}

if(lang){
  $('#langWrap').style.display='none';
  onboardingFatto=true;
  applicaTraduzioniStatiche();
  aggiornaPulsanteLingua();
  mostraSolo('welcomeWrap');
  caricaNomeStruttura();
}
</script>
</body>
</html>
