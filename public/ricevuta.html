<style>
  /* pagina pubblica delle RICEVUTE DI PAGAMENTO (/r/<codice>): stesso aspetto del gestionale.
     Due usi, decisi dal codice del link: l'ospite scrive a chi intestare la ricevuta, oppure
     il proprietario la firma col dito. Vedi api/_ricevutePagamento.js */
  :root{--bg:#0a0a0c; --surface:#171719; --surface2:#242428; --line:#2c2c31; --ink:#f3f3f6; --muted:#9a9aa4;
    --amber:#84e3d3; --accent-ink:#0a2723; --ok:#2dc653; --err:#ef476f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(1100px 620px at 50% -14%, rgba(132,227,211,.06), transparent 60%), var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; font-size:16px; line-height:1.5;
    padding:0 0 40px; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right)}
  header{padding:16px; padding-top:calc(16px + env(safe-area-inset-top)); border-bottom:1px solid var(--line)}
  .brand{display:inline-flex; align-items:center; gap:10px; font-weight:800; font-size:17px}
  .brand i{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#a7efe4,var(--amber))}
  .brand i svg{width:19px;height:19px}
  .brand b{color:var(--amber)}
  .wrap{max-width:560px; margin:0 auto; padding:18px 16px}
  h1{font-size:23px; margin:4px 0 6px; letter-spacing:-.02em}
  .sub{color:var(--muted); font-size:14px}
  .card{background:var(--surface); border-radius:24px; padding:18px; margin-top:16px}
  label{display:block; font-size:12.5px; color:var(--muted); margin:14px 0 5px; font-weight:600}
  input{width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--ink); border-radius:13px; padding:13px 12px; font-size:16px; font-family:inherit}
  input:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(132,227,211,.18)}
  .btn{appearance:none; border:none; border-radius:16px; font-size:16px; font-weight:800; padding:15px 18px; cursor:pointer; font-family:inherit; width:100%; margin-top:16px}
  .btn.primary{background:var(--amber); color:var(--accent-ink)}
  .btn.ghost{background:var(--surface2); color:var(--ink); width:auto; font-size:13.5px; padding:9px 14px; margin-top:8px}
  .btn:disabled{opacity:.55}
  .err{color:var(--err); font-size:14px; margin-top:12px; font-weight:600}
  .muted{color:var(--muted); font-size:13px}
  .grande{font-size:48px; text-align:center; margin:8px 0 2px}
  /* la ricevuta come foglio di carta */
  .foglio{background:#fff; color:#15151a; border-radius:14px; padding:18px 16px; margin-top:16px; font-size:13.5px; line-height:1.45}
  .foglio .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline; border-bottom:1px solid #e3e4e8; padding-bottom:8px}
  .foglio .tit{font-weight:900; font-size:16px; letter-spacing:.01em}
  .foglio .num{font-weight:800; white-space:nowrap}
  .foglio .et{font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:#6b6e76; margin-top:12px}
  .foglio .cols{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .foglio .somma{font-size:24px; font-weight:900; margin-top:2px}
  .foglio .gr{color:#6b6e76; font-size:12px}
  .foglio .voce{display:flex; justify-content:space-between; gap:10px; margin-top:8px}
  .foglio .tot{font-weight:800; border-top:1px solid #e3e4e8; padding-top:6px; margin-top:8px}
  .sig-wrap{background:#fff; border-radius:16px; margin-top:12px; position:relative; overflow:hidden}
  .sig-wrap canvas{width:100%; height:170px; display:block; touch-action:none; cursor:crosshair}
  .sig-wrap .riga{position:absolute; left:18px; right:18px; bottom:40px; border-bottom:1.5px dashed #c8cad0; pointer-events:none}
  .sig-wrap .x{position:absolute; left:16px; bottom:44px; color:#9a9ca4; font-size:15px; pointer-events:none}
  .pdf-vista img{width:100%; display:block; border-radius:12px; margin-top:10px; background:#fff}
  .lingue{display:flex; flex-wrap:wrap; gap:7px; padding:2px 0 10px; margin-bottom:6px}
  .lingue::-webkit-scrollbar{display:none}
  .lingue button{flex:0 0 auto; border:none; background:var(--surface2); border-radius:12px; padding:8px; cursor:pointer; line-height:0; box-shadow:inset 0 0 0 2px transparent}
  .lingue button.on{box-shadow:inset 0 0 0 2px var(--amber); background:rgba(132,227,211,.12)}
  .flagsvg{display:block; width:30px; height:20px; border-radius:3px; box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  .lingua{float:right; background:var(--surface2); color:var(--ink); border:none; border-radius:12px; padding:6px 10px; font-size:13px; font-family:inherit}
</style>
</head>

const LINGUE=Object.keys(T);
let lang=(()=>{ try{ const x=localStorage.getItem('lingua'); if(x&&T[x])return x; }catch(e){} const n=(navigator.language||'it').slice(0,2).toLowerCase(); return T[n]?n:(n==='hr'||n==='sr'?'bs':'en'); })();
const t=k=>{ const v=(T[lang]||T.it)[k]; return v==null?T.it[k]:v; };
function scegliLingua(l){ lang=l; try{ localStorage.setItem('lingua',l); }catch(e){} renderOspite(stato); }
const dIt=iso=>{ const [a,m,d]=String(iso||'').split('-'); return a?`${d}/${m}/${a}`:''; };
const euro=c=>(c/100).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
async function chiama(corpo){
  const r=await fetch('/api/promemoria',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({azione:'ricevutaPubblica',tok:TOK},corpo))});
  const d=await r.json().catch(()=>({}));
  if(!r.ok&&!d.error)d.error=t('errore');
  return d;
}
function errore(msg){
  $('#root').innerHTML=`<div class="card" style="text-align:center"><div class="grande">⚠️</div><h1 style="font-size:20px">${esc(msg)}</h1>
    <div class="muted">Se pensi che sia un errore, scrivi a chi ti ha mandato il link.</div></div>`;
}
let stato=null;
async function avvia(){
  if(!TOK){ errore('Il link è incompleto: copialo di nuovo per intero'); return; }
  let d; try{ d=await chiama({op:'apri'}); }catch(e){ errore(t('errore')); return; }
  if(!d.ok){ errore(d.error||t('errore')); return; }
  stato=d;
  if(d.modo==='ospite')return renderOspite(d);
  renderFirma(d);
}
/* ===== l'ospite scrive a chi intestare la ricevuta ===== */
function renderOspite(d){
  const periodo=`${d.casa?esc(d.casa)+' · ':''}${t('dal')} ${dIt(d.dal)} ${t('al')} ${dIt(d.al)}`.replace(/ {2,}/g,' ').replace(/· $/,'');
  if(d.fatto){ $('#root').innerHTML=`<div class="card" style="text-align:center"><div class="grande">✅</div><h1>${t('grazie_t')}</h1><div class="sub">${t('grazie')}</div><div class="muted" style="margin-top:10px">${periodo}</div></div>`; return; }
  $('#root').innerHTML=`
    <div class="lingue">${LINGUE.map(l=>`<button type="button" class="${l===lang?'on':''}" title="${T[l].nomeLingua}" aria-label="${T[l].nomeLingua}" onclick="scegliLingua('${l}')">${FLAGS[l]||l}</button>`).join('')}</div>
    <h1>🧾 ${t('tit_o')}</h1><div class="sub">${t('sub_o')}</div>
    <div class="card">
      <div class="muted">${t('soggiorno')}: ${periodo}</div>
      <label for="n">${t('nome')}</label><input id="n" autocomplete="organization" maxlength="120">
      <label for="i">${t('ind')}</label><input id="i" autocomplete="street-address" maxlength="180">
      <label for="c">${t('cf')}</label><input id="c" autocapitalize="characters" spellcheck="false" maxlength="30">
      <div id="msg"></div>
      <button class="btn primary" id="vai" onclick="inviaDati()">${t('invia')}</button>
    </div>`;
}
async function inviaDati(){
  const b=$('#vai'), msg=$('#msg');
  const intestatario={nome:$('#n').value, indirizzo:$('#i').value, cf:$('#c').value};
  const manca=intestatario.nome.trim().length<2?'e_nome':intestatario.indirizzo.trim().length<5?'e_ind':intestatario.cf.replace(/[^A-Za-z0-9]/g,'').length<11?'e_cf':'';
  if(manca){ msg.innerHTML=`<div class="err">${esc(t(manca))}</div>`; return; }
  b.disabled=true; msg.innerHTML='';
  try{
    const d=await chiama({op:'dati', intestatario});
    if(!d.ok){ msg.innerHTML=`<div class="err">${esc(d.error||t('errore'))}</div>`; b.disabled=false; return; }
    stato=d; renderOspite(d);
  }catch(e){ msg.innerHTML=`<div class="err">${t('errore')}</div>`; b.disabled=false; }
}
/* ===== il proprietario la legge e la firma col dito ===== */
function foglio(r){
  const it=r.intestatario||{}, em=r.emittente||{};
  return `<div class="foglio">
    <div class="top"><span class="tit">RICEVUTA DI PAGAMENTO</span><span class="num">N. ${esc(r.numero)}/${esc(r.anno)}</span></div>
    <div class="gr" style="text-align:right;margin-top:3px">Data ${dIt(r.data)}</div>
    <div class="cols">
      <div><div class="et">Emittente</div><b>${esc(em.nome)}</b>${em.indirizzo?'<br>'+esc(em.indirizzo):''}<br>C.F. ${esc(em.cf)}</div>
      <div><div class="et">Ricevuti da</div><b>${esc(it.nome)}</b>${it.indirizzo?'<br>'+esc(it.indirizzo):''}${it.cf?'<br>C.F./P.IVA '+esc(it.cf):''}</div>
    </div>
    <div class="et">La somma di</div><div class="somma">€ ${euro(r.totale)}</div><div class="gr">(${esc(r.lettere)} euro)</div>
    <div class="et">Per</div><div>${esc(r.descrizione)}${r.nota?' '+esc(r.nota):''}</div>
    <div class="voce"><span>Corrispettivo della locazione<br><span class="gr">fuori campo IVA, art. 4 D.P.R. 633/1972</span></span><span>€ ${euro(r.soggiorno)}</span></div>
    ${r.tassa?`<div class="voce"><span>Imposta di soggiorno<br><span class="gr">esclusa da IVA, art. 15 D.P.R. 633/1972</span></span><span>€ ${euro(r.tassa)}</span></div>`:''}
    <div class="voce tot"><span>Totale</span><span>€ ${euro(r.totale)}</span></div>
    <div class="gr" style="margin-top:6px">Pagamento ricevuto tramite: ${esc(r.pagamento)}.</div>
    ${r.marca?`<div class="gr" style="margin-top:6px">Marca da bollo da € 2,00 n. ${esc(r.marca.codice)} del ${dIt(r.marca.data)}.</div>`:''}
  </div>`;
}
let firmata=false, tracciata=false;
function bottonePdf(t){ return `<button class="btn ghost" id="pdfBtn" style="width:100%;margin-top:12px" onclick="vediPdf()">${t}</button><div class="pdf-vista" id="pdfVista"></div>`; }
// il PDF vero, pagina per pagina come immagini (pdf.js): sul telefono un PDF dentro la pagina non si vede
async function vediPdf(){
  const b=$('#pdfBtn'), w=$('#pdfVista'); if(!w)return;
  if(b){ b.disabled=true; b.textContent='Preparo il PDF…'; }
  try{
    const d=await chiama({op:'pdf'});
    if(!d.ok||!d.pdf)throw new Error(d.error||t('errore'));
    const img=await pdfToImmagini('data:application/pdf;base64,'+d.pdf,{maxPagine:3});
    w.innerHTML=img.map(u=>`<img src="${u}" alt="PDF della ricevuta">`).join('');
    if(b)b.style.display='none';
  }catch(e){ if(b){ b.disabled=false; b.textContent='📄 Riprova a vedere il PDF'; } w.innerHTML=`<div class="err">${esc(e.message||t('errore'))}</div>`; }
}
function renderFirma(d){
  const r=d.ricevuta||{};
  if(d.firmata){
    const q=new Date(d.firmata).toLocaleString('it-IT',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
    $('#root').innerHTML=`<div class="card" style="text-align:center"><div class="grande">✅</div><h1>Ricevuta firmata</h1>
      <div class="sub">Firmata il ${esc(q)}. Grazie! Il PDF lo manda all'ospite chi te l'ha girata.</div></div>
      ${bottonePdf('📄 Vedi il PDF firmato')}`;
    vediPdf();
    return;
  }
  $('#root').innerHTML=`
    <h1>✍️ Ricevuta da firmare</h1>
    <div class="sub">Controlla la ricevuta n. ${esc(r.numero)}/${esc(r.anno)} per <b>${esc((r.intestatario||{}).nome)}</b> e firma col dito nel riquadro bianco in fondo.</div>
    ${foglio(r)}
    ${bottonePdf('📄 Vedi l\'anteprima del PDF')}
    <div class="card">
      <div style="font-weight:800">Firma di ${esc((r.emittente||{}).nome)}</div>
      <div class="sig-wrap"><canvas id="cv"></canvas><span class="x">✕</span><span class="riga"></span></div>
      <button class="btn ghost" onclick="cancella()">↺ Cancella e rifai</button>
      <div id="msg"></div>
      <button class="btn primary" id="vai" onclick="firma()">✍️ Firma la ricevuta</button>
      <div class="muted" style="margin-top:10px">Firmando confermi di aver ricevuto la somma indicata.</div>
    </div>`;
  preparaCanvas();
}
function preparaCanvas(){
  const cv=$('#cv'), ctx=cv.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,3), r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#14141a';
  let giu=false, ultimo=null, conPointer=false;
  const pos=(x,y)=>{ const b=cv.getBoundingClientRect(); return {x:x-b.left,y:y-b.top}; };
  const inizia=(x,y)=>{ giu=true; ultimo=pos(x,y); tracciata=true; ctx.beginPath(); ctx.arc(ultimo.x,ultimo.y,1.2,0,7); ctx.fillStyle='#14141a'; ctx.fill(); };
  const muovi=(x,y)=>{ if(!giu)return; const p=pos(x,y); ctx.beginPath(); ctx.moveTo(ultimo.x,ultimo.y); ctx.lineTo(p.x,p.y); ctx.stroke(); ultimo=p; };
  const fine=()=>{ giu=false; };
  cv.addEventListener('pointerdown',e=>{ conPointer=true; e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){} inizia(e.clientX,e.clientY); });
  cv.addEventListener('pointermove',e=>{ if(!giu)return; e.preventDefault(); muovi(e.clientX,e.clientY); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,fine));
  cv.addEventListener('touchstart',e=>{ if(conPointer)return; e.preventDefault(); const p=e.touches[0]; inizia(p.clientX,p.clientY); },{passive:false});
  cv.addEventListener('touchmove',e=>{ if(conPointer)return; e.preventDefault(); const p=e.touches[0]; muovi(p.clientX,p.clientY); },{passive:false});
  cv.addEventListener('touchend',e=>{ if(conPointer)return; e.preventDefault(); fine(); },{passive:false});
}
function cancella(){ const cv=$('#cv'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); tracciata=false; }
// solo il tratto, ritagliato e rimpicciolito (niente spazio vuoto intorno nel PDF)
function pngFirma(){
  const cv=$('#cv'), ctx=cv.getContext('2d'), {width:w,height:h}=cv, px=ctx.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(px[(y*w+x)*4+3]>10){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0)return '';
  const m=8; x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(w-1,x1+m); y1=Math.min(h-1,y1+m);
  const sw=x1-x0+1, sh=y1-y0+1, sc=Math.min(1,700/sw,260/sh);
  const out=document.createElement('canvas'); out.width=Math.max(1,Math.round(sw*sc)); out.height=Math.max(1,Math.round(sh*sc));
  out.getContext('2d').drawImage(cv,x0,y0,sw,sh,0,0,out.width,out.height);
  return out.toDataURL('image/png');
}
async function firma(){
  const b=$('#vai'), msg=$('#msg');
  msg.innerHTML='';
  if(!tracciata){ msg.innerHTML='<div class="err">Fai la firma col dito nel riquadro bianco.</div>'; return; }
  const png=pngFirma(); if(!png){ msg.innerHTML='<div class="err">Fai la firma col dito nel riquadro bianco.</div>'; return; }
  b.disabled=true; b.textContent='Firmo…';
  try{
    const d=await chiama({op:'firma', png});
    if(!d.ok){ msg.innerHTML=`<div class="err">${esc(d.error||t('errore'))}</div>`; b.disabled=false; b.textContent='✍️ Firma la ricevuta'; return; }
    renderFirma(d); window.scrollTo(0,0);
  }catch(e){ msg.innerHTML=`<div class="err">${t('errore')}</div>`; b.disabled=false; b.textContent='✍️ Firma la ricevuta'; }
}
avvia();
</script>
