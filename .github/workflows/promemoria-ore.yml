# Promemoria su Telegram dei check-in da registrare (api/_telegram.js).
# RISERVA: dal 27/11/2026 il controllo ogni ora lo fa lo "Schedules" di Vercel (vercel.json →
# schedules.promemoria-telegram). Questo di GitHub, pur chiedendo "ogni ora", partiva solo 2-3 volte
# al giorno a orari a caso; resta solo come seconda chiamata nel caso Vercel si fermi.
# Il server decide da solo se è il momento (dalle 16 il giorno dell'arrivo, poi ogni 3 ore fino
# alle 22) e non manda mai due promemoria a meno di 2h30: chiamarlo in più non cambia niente.
name: Promemoria check-in (Telegram)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chiama KeyFlow
        run: curl -sS -m 90 "https://keyflowcheckin.vercel.app/api/promemoria?ogni3ore=1" || true
