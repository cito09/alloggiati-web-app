# Promemoria su Telegram dei check-in da registrare (api/_telegram.js).
# Vercel (piano gratuito) fa partire il cron solo una volta al giorno: questo lo chiama ogni ora.
# Il server decide da solo se è il momento (dalle 16 il giorno dell'arrivo, poi ogni 3 ore fino
# alle 22) e non manda mai due promemoria a meno di 3 ore: chiamarlo più spesso non cambia niente.
name: Promemoria check-in (Telegram)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chiama KeyFlow
        run: curl -sS -m 90 "https://keyflowcheckin.vercel.app/api/promemoria?ogni3ore=1" || true
